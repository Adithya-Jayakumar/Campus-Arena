apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena-frontend
  namespace: campus-arena
  labels:
    app: arena-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arena-frontend
  template:
    metadata:
      labels:
        app: arena-frontend
    spec:
      containers:
        - name: frontend
          image: campus-arena-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://arena-backend-svc:4000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: arena-frontend-svc
  namespace: campus-arena
spec:
  type: NodePort
  selector:
    app: arena-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
