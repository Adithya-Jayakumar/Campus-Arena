# Module IV.3: Kubernetes Backend Deployment & Service with Liveness/Readiness probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena-backend
  namespace: campus-arena
  labels:
    app: arena-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arena-backend
  template:
    metadata:
      labels:
        app: arena-backend
    spec:
      containers:
        - name: backend
          image: campus-arena-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              value: "k8s-cluster-secret-key-2026"
            - name: DATABASE_URL
              value: "file:./dev.db"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: arena-backend-svc
  namespace: campus-arena
spec:
  type: ClusterIP
  selector:
    app: arena-backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
