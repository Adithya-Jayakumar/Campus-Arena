# Module IV.4: CI/CD Pipelines - Concepts & Stages
# Continuous Integration & Delivery Pipeline for Campus Arena
name: Campus Arena CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: Static Code Analysis & Unit Testing
  backend-ci:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build NestJS Application
        working-directory: ./backend
        run: npm run build

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  # Stage 2: Container Image Build & Manifest Validation
  container-and-k8s:
    name: Docker & Kubernetes Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating k8s YAML configurations..."
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ['k8s/namespace.yaml', 'k8s/hpa.yaml']]"
          echo "All K8s manifests syntax valid."
